[project]
name = "bookstats"
version = "0.1.0"
description = "A cumulative research project analyzing Project Gutenberg word distributions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.0.0",
    "marimo>=0.11.0",
    "polars>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

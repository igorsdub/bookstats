[project]
name = "bookstats"
version = "0.1.0"
description = "A cumulative research project analyzing Project Gutenberg word distributions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.0.0",
    "ipython>=9.17.1",
    "marimo>=0.11.0",
    "polars>=1.0.0",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["ALL"]
